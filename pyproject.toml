[project]
name = "vcam"
version = "0.1.2"
description = "Virtual RTSP camera CLI: serve looping video files as multiplexed RTSP feeds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
vcam = "vcam.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
