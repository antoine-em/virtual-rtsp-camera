services:
  vcam:
    build: .
    image: vcam:latest
    # NTP clock sync: add cap_add below and --ntp-server to the command when you
    # want the container clock slaved to the EAIS station NTP server.
    # cap_add:
    #   - SYS_TIME     # grants adjtimex / clock_settime inside the container
    ports:
      - "8554:8554"
      # - "8555:8555"   # cameras with their own `port:` in cameras.yaml
    volumes:
      - ./cameras.yaml:/vcam/cameras.yaml:ro
      - ./videos:/vcam/videos:ro
    restart: unless-stopped
    # command: run --ntp-server 192.168.198.151

  # Unit tests:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
