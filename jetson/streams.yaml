# Stream manifest for synthetic toll-gate RTSP publisher
# One FFmpeg publisher per enabled stream

streams:
  - name: toll-overview-day
    source: /data/toll-overview-day.mp4
    offset_seconds: 0
    enabled: true

  - name: toll-plate-night
    source: /data/toll-plate-night.mp4
    offset_seconds: 12
    enabled: true

  - name: toll-overview-rain
    source: /data/toll-overview-rain.mp4
    offset_seconds: 0
    enabled: true

  - name: toll-overview-rush
    source: /data/toll-overview-rush.mp4
    offset_seconds: 0
    enabled: true
