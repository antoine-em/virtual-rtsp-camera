# Docker Compose for Jetson AGX Orin RTSP deployment
# Deploy on: NVIDIA Jetson AGX Orin (aarch64)

services:
  mediamtx:
    image: "bluenviron/mediamtx:latest"
    # Container images must support aarch64/ARM64.
    # On Jetson, build locally if needed:
    #   docker build -t mediamtx-aarch64 -f Dockerfile.mediamtx .
    container_name: synthetic-rtsp-mediamtx
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9997/v3/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - MTX_LOGLEVEL=warning

  publisher:
    image: "public.ecr.aws/docker/library/python:3.11-slim"
    container_name: synthetic-rtsp-publisher
    command: ["python3", "/app/publish-streams.py"]
    volumes:
      - ./streams.yaml:/app/streams.yaml:ro
      - ./publish-streams.py:/app/publish-streams.py:ro
      # Mount synthetic data directory (created by transfer script)
      - /home/edgeai/synthetic-data:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/app/health.json"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      - STREAM_CONFIG=/app/streams.yaml
      - DATA_DIR=/data

  install:
    image: "public.ecr.aws/docker/library/python:3.11-slim"
    container_name: synthetic-rtsp-install
    user: "root"
    volumes:
      - ./install.sh:/app/install.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/bash", "/app/install.sh"]
    # This service runs once and exits. Use 'docker compose run install'
